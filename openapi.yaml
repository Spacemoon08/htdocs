openapi: 3.0.3
info:
  title: Kursverwaltung API
  version: "1.0.0"
servers:
  - url: http://localhost
paths:
  # ==================== tbl_countries ====================
  /countries:
    get:
      summary: Länder abrufen
      parameters:
        - in: query
          name: id
          schema:
            type: string
          description: "ID des Landes oder 'all' für alle"
      responses:
        '200': { description: Erfolgreich }
    post:
      summary: Neues Land erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country: { type: string }
      responses: { '201': { description: Land erstellt } }
    put:
      summary: Land aktualisieren
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                country: { type: string }
      responses: { '200': { description: Aktualisiert } }
    delete:
      summary: Land löschen
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses: { '200': { description: Gelöscht } }

  # ==================== tbl_lehrbetriebe ====================
  /lehrbetriebe:
    get:
      summary: Alle Lehrbetriebe abrufen
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses: { '200': { description: Erfolgreich } }
    post:
      summary: Neuen Lehrbetrieb erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firma: { type: string }
                strasse: { type: string }
                plz: { type: string }
                ort: { type: string }
      responses: { '201': { description: Lehrbetrieb erstellt } }
    put:
      summary: Lehrbetrieb aktualisieren
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firma: { type: string }
                strasse: { type: string }
                plz: { type: string }
                ort: { type: string }
      responses: { '200': { description: Aktualisiert } }
    delete:
      summary: Lehrbetrieb löschen
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses: { '200': { description: Gelöscht } }

  # ==================== tbl_lernende ====================
  /lernende:
    get:
      summary: Alle Lernende abrufen
      parameters:
        - in: query
          name: id
          schema: { type: string }
          description: "ID des Lernenden oder 'all'"
      responses: { '200': { description: Erfolgreich } }
    post:
      summary: Lernenden erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vorname: { type: string }
                nachname: { type: string }
                strasse: { type: string }
                plz: { type: string }
                ort: { type: string }
                nr_land: { type: integer }
                geschlecht: { type: string, enum: ['m','w','d'] }
                telefon: { type: string }
                handy: { type: string }
                email: { type: string }
                email_privat: { type: string }
                birthdate: { type: string, format: date }
      responses: { '201': { description: Lernender erstellt } }
    put:
      summary: Lernenden aktualisieren
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vorname: { type: string }
                nachname: { type: string }
                strasse: { type: string }
                plz: { type: string }
                ort: { type: string }
                nr_land: { type: integer }
                geschlecht: { type: string, enum: ['m','w','d'] }
                telefon: { type: string }
                handy: { type: string }
                email: { type: string }
                email_privat: { type: string }
                birthdate: { type: string, format: date }
      responses: { '200': { description: Aktualisiert } }
    delete:
      summary: Lernenden löschen
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses: { '200': { description: Gelöscht } }

  # ==================== tbl_dozenten ====================
  /dozenten:
    get:
      summary: Alle Dozenten abrufen
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses: { '200': { description: Erfolgreich } }
    post:
      summary: Dozenten erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vorname: { type: string }
                nachname: { type: string }
                strasse: { type: string }
                plz: { type: string }
                ort: { type: string }
                nr_land: { type: integer }
                geschlecht: { type: string, enum: ['m','w','d'] }
                telefon: { type: string }
                handy: { type: string }
                email: { type: string }
                birthdate: { type: string, format: date }
      responses: { '201': { description: Dozent erstellt } }
    put:
      summary: Dozent aktualisieren
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vorname: { type: string }
                nachname: { type: string }
                strasse: { type: string }
                plz: { type: string }
                ort: { type: string }
                nr_land: { type: integer }
                geschlecht: { type: string, enum: ['m','w','d'] }
                telefon: { type: string }
                handy: { type: string }
                email: { type: string }
                birthdate: { type: string, format: date }
      responses: { '200': { description: Aktualisiert } }
    delete:
      summary: Dozent löschen
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses: { '200': { description: Gelöscht } }

  # ==================== tbl_lehrbetriebe_lernende ====================
  /lehrbetriebe_lernende:
    get:
      summary: Alle Lehrbetriebe-Lernende abrufen
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses: { '200': { description: Erfolgreich } }
    post:
      summary: Neue Lehrbetrieb-Lernende Beziehung erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nr_lehrbetrieb: { type: integer }
                nr_lernende: { type: integer }
                start: { type: string, format: date }
                ende: { type: string, format: date }
                beruf: { type: string }
      responses: { '201': { description: Beziehung erstellt } }
    put:
      summary: Beziehung aktualisieren
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nr_lehrbetrieb: { type: integer }
                nr_lernende: { type: integer }
                start: { type: string, format: date }
                ende: { type: string, format: date }
                beruf: { type: string }
      responses: { '200': { description: Aktualisiert } }
    delete:
      summary: Beziehung löschen
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses: { '200': { description: Gelöscht } }

  # ==================== tbl_kurse ====================
  /kurse:
    get:
      summary: Alle Kurse abrufen
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses: { '200': { description: Erfolgreich } }
    post:
      summary: Kurs erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kursnummer: { type: string }
                kursthema: { type: string }
                inhalt: { type: string }
                nr_dozent: { type: integer }
                startdatum: { type: string, format: date }
                enddatum: { type: string, format: date }
                dauer: { type: integer }
      responses: { '201': { description: Kurs erstellt } }
    put:
      summary: Kurs aktualisieren
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kursnummer: { type: string }
                kursthema: { type: string }
                inhalt: { type: string }
                nr_dozent: { type: integer }
                startdatum: { type: string, format: date }
                enddatum: { type: string, format: date }
                dauer: { type: integer }
      responses: { '200': { description: Aktualisiert } }
    delete:
      summary: Kurs löschen
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses: { '200': { description: Gelöscht } }

  # ==================== tbl_kurse_lernende ====================
  /kurse_lernende:
    get:
      summary: Alle Kurse-Lernende abrufen
      parameters:
        - in: query
          name: id
          schema: { type: string }
      responses: { '200': { description: Erfolgreich } }
    post:
      summary: Kurs-Lernende Beziehung erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nr_kurs: { type: integer }
                nr_lernende: { type: integer }
                note: { type: number, format: float }
      responses: { '201': { description: Beziehung erstellt } }
    put:
      summary: Beziehung aktualisieren
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nr_kurs: { type: integer }
                nr_lernende: { type: integer }
                note: { type: number, format: float }
      responses: { '200': { description: Aktualisiert } }
    delete:
      summary: Beziehung löschen
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer }
      responses: { '200': { description: Gelöscht } }
